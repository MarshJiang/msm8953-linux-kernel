%YAML 1.2
---
$id: http://devicetree.org/schemas/input/blackberry,mercury-keypad.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BlackBerry KEYone Keyboard Controller

maintainers:
  - MarshJiang <1208879283@qq.com>

description:
  The BlackBerry KEYone contains an I2C keyboard controller that scans the
  built-in physical keyboard and reports key transitions through a FIFO.

allOf:
  - $ref: matrix-keymap.yaml#

properties:
  compatible:
    const: blackberry,mercury-keypad

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  i2c-supply:
    description: Supply for the keyboard controller I2C interface

  reset-gpios:
    maxItems: 1

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - i2c-supply
  - reset-gpios
  - keypad,num-rows
  - keypad,num-columns
  - linux,keymap

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/input/input.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        keyboard@40 {
            compatible = "blackberry,mercury-keypad";
            reg = <0x40>;

            interrupt-parent = <&tlmm>;
            interrupts = <12 IRQ_TYPE_LEVEL_LOW>;
            i2c-supply = <&keyboard_i2c_vreg>;
            reset-gpios = <&tlmm 66
                           (GPIO_ACTIVE_LOW | GPIO_OPEN_DRAIN)>;

            keypad,num-rows = <8>;
            keypad,num-columns = <8>;
            linux,keymap = <MATRIX_KEY(3, 1, KEY_Q)>;
        };
    };
