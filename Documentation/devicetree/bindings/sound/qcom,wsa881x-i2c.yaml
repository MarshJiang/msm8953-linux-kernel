%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,wsa881x-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm WSA8810/WSA8815 I2C/PDM speaker amplifier

maintainers:
  - Linux ARM MSM mailing list <linux-arm-msm@vger.kernel.org>

description:
  The WSA8810 and WSA8815 are Class-D smart speaker amplifiers. Older
  platforms control separate digital and analog register banks over two I2C
  addresses and feed analog audio to the amplifier from the internal codec.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: qcom,wsa881x-i2c

  reg:
    items:
      - description: Digital register bank
      - description: Analog register bank

  reg-names:
    items:
      - const: digital
      - const: analog

  reset-gpios:
    description: Active-low SD_N reset and shutdown pin
    maxItems: 1

  vdd-supply:
    description: Regulator for the external WSA supply switch

  sound-name-prefix: true

required:
  - compatible
  - reg
  - reg-names
  - reset-gpios
  - vdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    vdd_wsa: regulator {
        compatible = "regulator-fixed";
        regulator-name = "vdd-wsa";
    };

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        amplifier@e {
            compatible = "qcom,wsa881x-i2c";
            reg = <0x0e>, <0x44>;
            reg-names = "digital", "analog";
            reset-gpios = <&tlmm 96 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vdd_wsa>;
            sound-name-prefix = "Speaker";
        };
    };
...
